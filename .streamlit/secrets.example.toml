# =============================================================================
# IHS Smart CDSS - Streamlit secrets TEMPLATE
# =============================================================================
# Copy this file to ".streamlit/secrets.toml" and fill in the real values.
#
#   cp .streamlit/secrets.example.toml .streamlit/secrets.toml
#
# ".streamlit/secrets.toml" is git-ignored and MUST NEVER be committed.
# On Streamlit Community Cloud, paste these values into the app's
# "Settings -> Secrets" editor instead of using a local file.
# =============================================================================

# --- AI providers -----------------------------------------------------------
# The app works with any ONE of these. Configure at least one for full answers.
# (Safety checks and basic responses still work without any provider.)
GROQ_API_KEY = ""
GROQ_MODEL = "llama-3.3-70b-versatile"

CEREBRAS_API_KEY = ""
CEREBRAS_MODEL = ""

GEMINI_API_KEY = ""
GEMINI_MODEL = "gemini-2.0-flash"
GEMINI_VISION_MODEL = "gemini-2.5-flash"

OPENROUTER_API_KEY = ""
OPENROUTER_MODEL = ""

# --- General Diagnostics (optional OpenAI fallback) -------------------------
OPENAI_API_KEY = ""

# --- Local model server (optional) ------------------------------------------
OLLAMA_BASE_URL = ""
OLLAMA_MODEL = ""

# --- Google Sheets backend --------------------------------------------------
# The Clinical Chatbot, appointments and patient store read from a Google
# Sheet. The ID below matches google_config.json -> google_sheet.spreadsheet_id.
GOOGLE_SHEET_ID = "1vZ925J5svbJZVpZXp1O8naU3_R_55tLWQ333bqzDKPA"

[google_config.google_sheet]
spreadsheet_id = "1vZ925J5svbJZVpZXp1O8naU3_R_55tLWQ333bqzDKPA"
worksheet_name = "Users"
patient_worksheet_name = "Patients"

# --- Google service account -------------------------------------------------
# Paste the full contents of the service-account JSON key here. The leading
# private_key newlines must be escaped as "\n" exactly as they appear in the
# downloaded JSON file.
[service_account]
type = "service_account"
project_id = ""
private_key_id = ""
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = ""
client_id = ""
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = ""
